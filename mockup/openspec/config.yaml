# openspec/config.yaml
schema: spec-driven

context: |
  Project: Ludo Sport Drake Academy
  Stack: Next.js 16.2.10 / React 19 / TypeScript 5 / Tailwind CSS 4 / bun
  Architecture: App Router, Server Components by default, Client Components as leaves, monorepo at /home/anon/Work/ludosport (apps/landing candidate)
  Testing: ESLint 9 (eslint-config-next), TypeScript strict (tsc), no unit/e2e runner yet
  Language: Spanish (content), English (code identifiers/comments)

rules:
  proposal:
    - Include migration impact assessment
    - Reference @next/next lint rules
    - Include build step considerations
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Add Server vs Client Component decision per section
  design:
    - Document next/font, next/image, Metadata API usage
    - Document starfield CSS migration strategy
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Use PR stacking (stacked-to-main)
    - Use atomic sections per task
  apply:
    guidelines:
      - Follow existing BEM-like naming conventions
      - Maintain Spanish content, English code/comments
    tdd: false
    test_command: "bun run lint"
  verify:
    test_command: ""
    build_command: "bun run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  reason: "No test runner detected — Next.js 16 project with ESLint and TypeScript strict but no Vitest/Jest/Playwright"
  frameworks: {}
  coverage: false
  linters:
    eslint: "bun run lint"
  type_checkers:
    typescript: "npx tsc --noEmit"
  formatters: {}
