# openspec/config.yaml
schema: spec-driven

context: |
  Project: Ludo Sport Drake Academy — P7
  Stack: static HTML5 / CSS3 / vanilla JS (single-page landing page)
  Architecture: single-page BEM-like CSS, no framework, no build, no router
  Testing: none detected — pure static site, no test runner, no CI
  Language: Spanish (content), English (code identifiers/comments)
  Audit: heuristic_audit.csv with 24 rows (Nielsen + WCAG issues)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference heuristic_audit.csv findings by ID
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Keep designs simple — static site with no build step
    - Document CSS and JS changes with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing BEM-like naming conventions
      - Maintain Spanish content, English code/comments
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  reason: "No test runner detected — pure static HTML/CSS/JS with no package.json, build system, or CI"
  frameworks: {}
  coverage: false
  linters: {}
  type_checkers: {}
  formatters: {}
