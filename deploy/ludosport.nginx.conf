# Ludo Sport Drake Academy — nginx static site config
# Place at: /etc/nginx/sites-available/ludosport
# Enable:   ln -s /etc/nginx/sites-available/ludosport /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ludosport.com www.ludosport.com;

    # Redirect all HTTP to HTTPS (run certbot first to get the certificate,
    # then uncomment this block and comment out the root/location below)
    # return 301 https://$host$request_uri;

    root /var/www/ludosport;
    index index.html;

    # ─── Security headers ───────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), autoplay=(), fullscreen=(self), gyroscope=(), magnetometer=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.basemaps.cartocdn.com https://*.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ─── Compression ────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 256;
    gzip_vary on;

    # ─── Static assets with long cache ──────────────────
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /photos/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /logo.jpeg {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Fonts ──────────────────────────────────────────
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ─── HTML — never cached (always fresh) ─────────────
    location ~ \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── Robots / Sitemap ───────────────────────────────
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ─── Main routes ────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ─── Custom 404 ─────────────────────────────────────
    error_page 404 /404.html;

    # ─── Deny hidden files ──────────────────────────────
    location ~ /\. {
        deny all;
    }
}

