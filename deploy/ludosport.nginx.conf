# Ludo Sport Drake Academy — nginx behind Cloudflare proxy
# Place at: /etc/nginx/sites-available/ludosport
# Enable:   ln -sf /etc/nginx/sites-available/ludosport /etc/nginx/sites-enabled/

# ─── Real client IP from Cloudflare ──────────────────
# Cloudflare IP ranges: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ─── HTTP → redirect to HTTPS ────────────────────────
server {
    listen 80;
    server_name ludosport.com www.ludosport.com;

    # When behind Cloudflare, still redirect to HTTPS.
    # Cloudflare will handle the public side, we redirect internally.
    return 301 https://$host$request_uri;
}

# ─── HTTPS with Cloudflare Origin CA ──────────────────
server {
    listen 443 ssl http2;
    server_name ludosport.com www.ludosport.com;

    # Cloudflare Origin CA certificate (generate from Cloudflare dashboard)
    ssl_certificate     /etc/nginx/ssl/ludosport.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ludosport.com.key;

    # Cloudflare only negotiates these
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Verify it's Cloudflare connecting (optional but recommended)
    # Allow only Cloudflare IPs — comment out if you need direct access too
    # include /etc/nginx/cloudflare-allow.conf;
    # deny all;

    root /var/www/ludosport;
    index index.html;

    # ─── Security headers ─────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), autoplay=(), fullscreen=(self), gyroscope=(), magnetometer=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.basemaps.cartocdn.com https://*.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ─── Compression ──────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 256;
    gzip_vary on;

    # ─── Static assets with long cache ────────────────
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /photos/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /logo.jpeg {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Fonts ────────────────────────────────────────
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ─── HTML — never cached ──────────────────────────
    location ~ \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── Robots / Sitemap ─────────────────────────────
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ─── Main routes ──────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ─── Custom 404 ───────────────────────────────────
    error_page 404 /404.html;

    # ─── Deny hidden files ────────────────────────────
    location ~ /\. {
        deny all;
    }
}
